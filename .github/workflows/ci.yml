name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: termsinator_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d termsinator_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/termsinator_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Go tests
        run: go test -race ./...
      - name: Frontend install
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Frontend check and build
        run: pnpm --dir frontend build
      - name: Validate JSON contracts
        run: for file in schemas/*.json extension/manifest.json; do python3 -m json.tool "$file" >/dev/null; done
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-only
        run: docker compose -f compose.production.yml config --quiet
